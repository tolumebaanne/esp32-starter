; Settings for this project. VS Code with PlatformIO reads this file.
; This project needs one extra library for the live connection to the web page.
; PlatformIO downloads it by itself the first time you upload.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = links2004/WebSockets@^2.4.1
